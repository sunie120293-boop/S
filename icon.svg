<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="24"/>

  <!-- Sparkles -->
  <circle cx="95" cy="115" r="14" fill="#fbbf24"/>
  <circle cx="415" cy="135" r="16" fill="#f43f5e"/>
  <circle cx="415" cy="385" r="14" fill="#38bdf8"/>
  <circle cx="95" cy="380" r="12" fill="#10b981"/>

  <!-- Backpack top handle -->
  <path d="M 200 150 C 200 100, 312 100, 312 150" fill="none" stroke="#9f1239" stroke-width="24" stroke-linecap="round"/>

  <!-- Backpack body -->
  <rect x="146" y="150" width="220" height="240" rx="46" fill="url(#bagGrad)"/>

  <!-- Flap line -->
  <path d="M 146 220 C 146 260, 366 260, 366 220" fill="none" stroke="#881337" stroke-width="8"/>

  <!-- Pocket -->
  <rect x="176" y="270" width="160" height="100" rx="22" fill="url(#pocketGrad)"/>
  <path d="M 176 302 L 336 302" stroke="#0369a1" stroke-width="6"/>

  <!-- Star emblem on pocket -->
  <polygon points="256,295 264,312 282,314 269,326 273,344 256,334 239,344 243,326 230,314 248,312" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>

  <!-- Buckles -->
  <rect x="190" y="200" width="28" height="14" rx="5" fill="#fef08a"/>
  <rect x="294" y="200" width="28" height="14" rx="5" fill="#fef08a"/>
</svg>
